<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab 7 - Unsplash API</title>

<style>
    body {
        font-family: Arial;
        margin: 20px;
        background: #f5f5f5;
    }

    h1 {
        margin-bottom: 20px;
    }

    input {
        padding: 10px;
        width: 250px;
    }

    button {
        padding: 10px 15px;
        margin-left: 5px;
        cursor: pointer;
    }

    #gallery {
        margin-top: 20px;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
        gap: 15px;
    }

    img {
        width: 100%;
        border-radius: 10px;
    }
</style>
</head>

<body>

<h1>Unsplash API Search</h1>

<input type="text" id="searchInput" placeholder="Search images...">

<button onclick="searchXHR()">Search using XHR</button>
<button onclick="searchFetch()">Search using Fetch</button>
<button onclick="searchAsync()">Search using Async/Await</button>

<div id="gallery"></div>

<script>
const ACCESS_KEY = "FTH3H53uTCJ8BC0G5UtRz39HjZiVgPO3FkVfMfiltWY";

function displayImages(data) {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    data.forEach(photo => {
        const img = document.createElement("img");
        img.src = photo.urls.small;
        gallery.appendChild(img);
    });
}

function getQuery() {
    return document.getElementById("searchInput").value || "Makkah";
}

/////////////////////////////
// 1️⃣ XHR
/////////////////////////////
function searchXHR() {
    const query = getQuery();
    const xhr = new XMLHttpRequest();

    xhr.open("GET", `https://api.unsplash.com/search/photos?query=${query}&client_id=${ACCESS_KEY}`);

    xhr.onload = function() {
        const response = JSON.parse(xhr.responseText);
        displayImages(response.results);
    };

    xhr.send();
}

/////////////////////////////
// 2️⃣ Fetch (Promises)
/////////////////////////////
function searchFetch() {
    const query = getQuery();

    fetch(`https://api.unsplash.com/search/photos?query=${query}&client_id=${ACCESS_KEY}`)
        .then(response => response.json())
        .then(data => displayImages(data.results));
}

/////////////////////////////
// 3️⃣ Fetch (Async/Await)
/////////////////////////////
async function searchAsync() {
    const query = getQuery();

    const response = await fetch(`https://api.unsplash.com/search/photos?query=${query}&client_id=${ACCESS_KEY}`);
    const data = await response.json();

    displayImages(data.results);
}

</script>

</body>
</html>
