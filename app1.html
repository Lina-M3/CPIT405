<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-header">
    <nav>
        <a href="assignment1.html">Home</a>
        <a href="schedule.html">Class Schedule</a>
        <a href="contact.html">Contact</a>
        <a href="myworks.html">My Works</a>
    </nav>
</header>

<div class="container">

    <aside class="sidebar">
        <img src="images/profile.jpg" class="profile-img">
        <h2>Lina Mohammed</h2>
        <p>IT Student</p>
    </aside>

    <main class="content">
        <h1>To-Do List</h1>

        <input type="text" id="taskInput" placeholder="Enter a task">
        <button onclick="addTask()">Add</button>

        <ul id="taskList"></ul>
    </main>
</div>

<footer>
    <p>© 2025 Lina Mohammed</p>
</footer>

<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

function displayTasks() {
    let list = document.getElementById("taskList");
    list.innerHTML = "";

    tasks.forEach((task, index) => {
        let li = document.createElement("li");
        li.innerHTML = task + " <button onclick='deleteTask(" + index + ")'>X</button>";
        list.appendChild(li);
    });
}

function addTask() {
    let input = document.getElementById("taskInput");
    if (input.value.trim() === "") return;

    tasks.push(input.value);
    localStorage.setItem("tasks", JSON.stringify(tasks));

    input.value = "";
    displayTasks();
}

function deleteTask(index) {
    tasks.splice(index, 1);
    localStorage.setItem("tasks", JSON.stringify(tasks));
    displayTasks();
}

displayTasks();
</script>

</body>
</html>
